name: Update monthly contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: monthly-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate light and dark charts
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_STATS_TOKEN || github.token }}
          PROFILE_USERNAME: MuhammadZainUlIslam
        run: python3 scripts/monthly_contributions.py

      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add profile/monthly-contributions-light.svg profile/monthly-contributions-dark.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "docs(profile): update monthly contribution charts"
          git pull --rebase
          git push
